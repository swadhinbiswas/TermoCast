name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check termocast/ --output-format=github || echo "::warning::ruff found issues"
      - name: Ruff format check
        run: ruff format --check termocast/ || echo "::warning::format issues"

  test:
    name: Test py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          pip install -e .
      - name: Syntax check
        run: python -m py_compile termocast/app.py termocast/cli.py termocast/services/*.py
      - name: Import smoke
        run: |
          python -c "import termocast; print(termocast.__version__)"
          python -c "from termocast.services.weather import WeatherService; print('weather ok')"
          python -c "from termocast.app import TermoCastApp; print('tui ok')"
          termocast --help
          termocast config show
      - name: Run pytest
        run: pytest -v --tb=short || python -m pytest tests/ -v

  build:
    name: Build sdist/wheel
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build
        run: pip install build twine
      - name: Build
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/*
          retention-days: 7

  debian:
    name: Build Debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install debhelper
        run: sudo apt-get update && sudo apt-get install -y build-essential debhelper dh-python python3-all python3-setuptools
      - name: Build deb
        run: dpkg-buildpackage -us -uc -b || echo "::warning::deb build failed (non-fatal for CI)"
      - name: List deb
        run: ls -lh ../*.deb || echo "no deb"
