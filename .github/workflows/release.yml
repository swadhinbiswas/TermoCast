name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: List dist
        run: ls -lh dist/
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    # Only attempt PyPI if trusted publishing is configured OR token exists; otherwise skip gracefully
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/termocast
    permissions:
      id-token: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - name: Publish to PyPI (trusted publishing)
        id: pypi-trusted
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
      - name: Publish fallback via token
        if: steps.pypi-trusted.outcome == 'failure' && secrets.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true
      - name: Note if skipped
        if: steps.pypi-trusted.outcome == 'failure' && secrets.PYPI_API_TOKEN == ''
        run: echo "::warning::PyPI publish skipped — configure trusted publisher at https://pypi.org/manage/account/publishing/ or set PYPI_API_TOKEN secret"

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - name: Generate release notes
        run: |
          echo "## TermoCast ${{ github.ref_name }}" > release_notes.md
          echo "" >> release_notes.md
          echo "### Changes" >> release_notes.md
          git log $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD --pretty=format:"- %s (%h)" >> release_notes.md || echo "- Initial 1.0 release" >> release_notes.md
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          cat release_notes.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release_notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  debian-release:
    name: Build and attach Debian package
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential debhelper dh-python python3-all python3-setuptools
      - name: Build deb
        run: |
          dpkg-buildpackage -us -uc -b || (echo "::warning::deb build failed, retry with -d"; dpkg-buildpackage -us -uc -b -d || true)
          ls -lh ../*.deb || echo "no deb produced"
      - name: Upload deb to release
        if: hashFiles('../*.deb') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: ../*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
