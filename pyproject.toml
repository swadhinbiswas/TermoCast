[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "termocast"
version = "1.0.0"
description = "Advanced terminal dashboard — Weather • News • Stocks • Crypto (Textual TUI + Rich)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Swadhin Biswas", email = "swadhinbiswas.cse@gmail.com"}]
maintainers = [{name = "Swadhin Biswas", email = "swadhinbiswas.cse@gmail.com"}]
keywords = ["weather", "cli", "tui", "textual", "rich", "news", "stocks", "crypto", "terminal", "dashboard"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console :: Curses",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "requests>=2.28",
  "geocoder>=1.38",
  "rich>=13.0",
  "typer>=0.9",
  "textual>=6.0",
  "httpx>=0.24",
]

[project.urls]
Homepage = "https://github.com/swadhinbiswas/TermoCast"
Repository = "https://github.com/swadhinbiswas/TermoCast"
Issues = "https://github.com/swadhinbiswas/TermoCast/issues"
Changelog = "https://github.com/swadhinbiswas/TermoCast/releases"

[project.scripts]
termocast = "termocast.cli:app"
weather = "termocast.cli:weather_entry"

[tool.setuptools.packages.find]
include = ["termocast*", "usr*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v"

[tool.twine]
disable-progress-bar = true
